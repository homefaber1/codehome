
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇 - Canvas版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            overflow: hidden;
            touch-action: none;
        }

        .retro-font {
            font-family: 'Press Start 2P', cursive;
        }

        .game-container {
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #4a5568;
            border-radius: 12px;
            background-color: #0f172a;
            position: relative;
        }

        canvas {
            display: block;
            border-radius: 8px;
        }

        .btn-retro {
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #b91c1c;
        }

        .btn-retro:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b91c1c;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.1s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        /* 移动端虚拟按键布局 */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            margin: 0 auto;
        }
        
        .d-pad button:nth-child(1) { grid-column: 2; } /* Up */
        .d-pad button:nth-child(2) { grid-column: 1; grid-row: 2; } /* Left */
        .d-pad button:nth-child(3) { grid-column: 3; grid-row: 2; } /* Right */
        .d-pad button:nth-child(4) { grid-column: 2; grid-row: 3; } /* Down */

        @media (min-width: 768px) {
            .mobile-controls {
                display: none;
            }
        }

        @media (max-width: 767px) {
            body {
                height: auto !important;
                min-height: 100vh;
                min-height: 100svh;
                width: 100% !important;
                overflow-x: hidden;
                overflow-y: auto;
                justify-content: flex-start !important;
                padding: 16px 12px 12px;
            }

            .game-header {
                position: static !important;
                width: min(100%, 416px);
                max-width: none !important;
                padding: 0 !important;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin-bottom: 16px;
            }

            .game-brand {
                justify-content: center;
                gap: 10px !important;
            }

            .game-brand i {
                font-size: 1.5rem;
            }

            .game-brand h1 {
                font-size: 1.25rem;
                line-height: 1.4;
                letter-spacing: 0.12em;
            }

            .game-stats {
                width: 100%;
                justify-content: center !important;
                gap: 6px !important;
                font-size: 0.75rem;
            }

            .game-stat {
                padding: 0.4rem 0.5rem;
                border-radius: 0.5rem;
                white-space: nowrap;
            }

            .game-stat-label {
                font-size: 0.65rem;
            }

            .game-stat-value {
                margin-left: 0.25rem;
            }

            .game-stats button {
                padding: 0.4rem 0.5rem;
                font-size: 0.65rem;
            }

            .game-container {
                width: min(100%, 416px);
                padding: 6px;
            }

            .game-container canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1;
            }

            .mobile-controls {
                flex: none;
                margin-top: 12px;
                padding: 0;
            }

            footer {
                margin-top: 12px;
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center text-white">

    <!-- 头部信息 -->
    <div class="game-header absolute top-4 w-full px-6 flex justify-between items-center max-w-4xl z-10">
        <div class="game-brand flex items-center gap-3">
            <i class="fa-solid fa-gamepad text-3xl text-emerald-400"></i>
            <h1 class="text-2xl font-bold tracking-wider retro-font text-emerald-400 drop-shadow-md">SNAKE</h1>
        </div>
        <div class="game-stats flex flex-wrap items-center justify-end gap-3 text-lg font-mono">
            <button id="pauseBtn" class="hidden bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg text-sm font-bold" type="button">
                PAUSE
            </button>
            <button id="resumeBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-bold" type="button">
                RESUME
            </button>
            <div class="game-stat bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-600">
                <span class="game-stat-label text-slate-400 text-sm">LEVEL</span>
                <span id="levelDisplay" class="game-stat-value ml-2 text-cyan-400 font-bold">1 / 5</span>
            </div>
            <div class="game-stat bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-600">
                <span class="game-stat-label text-slate-400 text-sm">SCORE</span>
                <span id="scoreDisplay" class="game-stat-value ml-2 text-emerald-400 font-bold">0</span>
            </div>
            <div class="game-stat bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-600">
                <span class="game-stat-label text-slate-400 text-sm">HIGH</span>
                <span id="highScoreDisplay" class="game-stat-value ml-2 text-yellow-400 font-bold">0</span>
            </div>
        </div>
    </div>

    <!-- 游戏主区域 -->
    <div class="relative game-container p-2">
        <canvas id="gameCanvas" width="400" height="400" class="bg-slate-900"></canvas>
        
        <!-- 开始/暂停遮罩层 -->
        <div id="overlay" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-20 rounded-lg">
            <h2 id="overlayTitle" class="text-4xl mb-6 retro-font text-emerald-400 text-center leading-relaxed">READY?</h2>
            <p id="overlaySubtitle" class="text-slate-400 mb-8 text-sm font-mono">After starting, press an arrow key or WASD to move</p>
            <button id="startBtn" class="btn-retro bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg text-lg">
                START GAME
            </button>
        </div>

        <!-- 游戏结束遮罩层 (默认隐藏) -->
        <div id="gameOverOverlay" class="hidden absolute inset-0 bg-red-900/90 flex flex-col items-center justify-center z-30 rounded-lg">
            <h2 class="text-4xl mb-2 retro-font text-white">GAME OVER</h2>
            <p class="text-xl mb-6 font-mono">Final Score: <span id="finalScore" class="text-yellow-400">0</span></p>
            <button id="restartBtn" class="btn-retro bg-white text-red-900 hover:bg-gray-200 font-bold py-3 px-8 rounded-lg text-lg">
                TRY AGAIN
            </button>
        </div>

        <div id="victoryOverlay" class="hidden absolute inset-0 bg-emerald-900/90 flex flex-col items-center justify-center z-30 rounded-lg">
            <h2 class="text-4xl mb-2 retro-font text-emerald-300 text-center">YOU WIN!</h2>
            <p class="text-xl mb-6 font-mono">All 5 levels complete! Score: <span id="victoryScore" class="text-yellow-300">10000</span></p>
            <button id="playAgainBtn" class="btn-retro bg-white text-emerald-900 hover:bg-gray-200 font-bold py-3 px-8 rounded-lg text-lg">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- 移动端控制区 -->
    <div class="mobile-controls mt-6 w-full max-w-xs px-4">
        <div class="d-pad">
            <button class="control-btn h-14 rounded-lg flex items-center justify-center text-2xl" data-dir="up"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="control-btn h-14 rounded-lg flex items-center justify-center text-2xl" data-dir="left"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="control-btn h-14 rounded-lg flex items-center justify-center text-2xl" data-dir="right"><i class="fa-solid fa-arrow-right"></i></button>
            <button class="control-btn h-14 rounded-lg flex items-center justify-center text-2xl" data-dir="down"><i class="fa-solid fa-arrow-down"></i></button>
        </div>
    </div>

    <footer class="mb-4 px-4 text-center text-sm text-slate-300">
        游戏说明：使用键盘 ↑ ↓ ← → 控制蛇移动，按空格键暂停或继续游戏。
    </footer>

    <script src="game.js"></script>
</body>
</html>
